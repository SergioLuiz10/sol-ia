name: solIA
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: solIA-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    
    volumes:
      - solIA-db-data:/var/lib/postgresql/data

volumes:
  solIA-db-data:

